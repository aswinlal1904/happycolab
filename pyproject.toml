[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "happycolab"
version = "1.1.1"
description = "HappyColab: High-speed LLM bridge between Google Colab GPU and local machines with native tool execution"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Aswin Lal S Y" }]
dependencies = [
    "openai>=1.30.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/aswinlal1904/happycolab"
Repository = "https://github.com/aswinlal1904/happycolab"
Issues = "https://github.com/aswinlal1904/happycolab/issues"

[project.scripts]
happycolab = "happycolab.cli:main"
happy-chat = "happycolab.cli:main"

[tool.setuptools.packages.find]
include = ["happycolab*"]

[tool.setuptools.package-data]
happycolab = ["*.ipynb"]

